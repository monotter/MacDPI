# ── MacDPI settings ──────────────────────────────────────────────────────────
# The single source of truth. Run.sh reads this to generate the sing-box config
# and to build the ciadpi command line. This is the only file you edit.

# Local port ciadpi listens on and sing-box forwards the bypassed traffic to.
PROXY_PORT=1080

# ciadpi desync strategy — everything you would type after "--port N".
# --fake and --timeout are compiled out on macOS; use --split / --disorder /
# --oob / --disoob / --tlsrec / --mod-http. Chain fallbacks with -A (auto trigger).
CIADPI_ARGS="-r 1+s --oob 1 -A torst,ssl_err -r 1+s --disorder 1 -A torst,ssl_err -r 1+s --split 1+s"

# Max concurrent connections through ciadpi (byedpi -c). Default in byedpi is 512,
# which is fine for selective mode but far too low for global mode, where the whole
# machine's TCP flows through the proxy — you hit "add_event: pool is full" and
# connections get dropped. 8192 gives comfortable headroom; raise it if you still
# see the message. Each slot can use up to a 16 KB buffer per direction.
MAX_CONN=8192

# DNS-over-HTTPS resolver, so the ISP cannot poison lookups.
DOH_SERVER=1.1.1.1

# Drop QUIC (UDP 443) so apps fall back to TCP, where the desync works.
BLOCK_QUIC=true

# What goes through the bypass:
#   selective — only the apps and domains listed below (everything else direct)
#   global    — everything except LAN and ciadpi's own traffic
MODE=selective

# Used only in selective mode. macOS process names:
APPS=(
  "Discord"
  "Discord Helper"
  "Roblox"
  "RobloxPlayer"
  "RobloxStudio"
  "RobloxStudioBeta"
)

# Used only in selective mode. Domain suffixes:
DOMAINS=(
  discord.com
  discord.gg
  discordapp.com
  discordapp.net
  discord.media
  roblox.com
  rbxcdn.com
  roblox.la
)
